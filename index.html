<!DOCTYPE html>
<!-- InfiniteSpecies — Single-page app shell: meta, title, root div; JS/CSS injected by Vite. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f1a" />

    <!-- Primary Meta Tags -->
    <title>InfiniteSpecies.com - Explore the Tree of Life</title>
    <meta name="title" content="InfiniteSpecies.com - Explore the Tree of Life" />
    <meta name="description" content="Millions of organisms, one zoomable map. Explore the complete tree of life in an interactive visualization — zoom from domains down to individual species and search by scientific name." />
    <meta name="author" content="InfiniteSpecies" />
    <meta name="application-name" content="InfiniteSpecies" />

    <!-- Canonical: deep links use the URL hash (#path), which crawlers ignore, so the homepage is the single canonical URL. -->
    <link rel="canonical" href="https://infinitespecies.com/" />

    <!-- Crawling directives: allow indexing and large image/snippet previews in search results. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://infinitespecies.com/" />
    <meta property="og:title" content="InfiniteSpecies.com - Explore the Tree of Life" />
    <meta property="og:description" content="Millions of organisms, one zoomable map. Explore the complete tree of life in an interactive visualization — zoom from domains down to individual species and search by scientific name." />
    <meta property="og:site_name" content="InfiniteSpecies.com" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="he_IL" />
    <meta property="og:image" content="https://infinitespecies.com/landing-tree-bg1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1267" />
    <meta property="og:image:height" content="1256" />
    <meta property="og:image:alt" content="A radial map of the tree of life rendered by InfiniteSpecies." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://infinitespecies.com/" />
    <meta property="twitter:title" content="InfiniteSpecies.com - Explore the Tree of Life" />
    <meta property="twitter:description" content="Millions of organisms, one zoomable map. Explore the complete tree of life in an interactive visualization — zoom from domains down to individual species and search by scientific name." />
    <meta property="twitter:image" content="https://infinitespecies.com/landing-tree-bg1.png" />
    <meta property="twitter:image:alt" content="A radial map of the tree of life rendered by InfiniteSpecies." />

    <!-- Structured data: helps search engines understand the site and app (rich-result eligibility). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://infinitespecies.com/#website",
          "url": "https://infinitespecies.com/",
          "name": "InfiniteSpecies",
          "description": "An interactive, zoomable visualization of the biological tree of life.",
          "inLanguage": ["en", "he"],
          "publisher": { "@id": "https://infinitespecies.com/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://infinitespecies.com/#organization",
          "name": "InfiniteSpecies",
          "url": "https://infinitespecies.com/",
          "logo": "https://infinitespecies.com/landing-tree-bg1.png"
        },
        {
          "@type": "WebApplication",
          "@id": "https://infinitespecies.com/#webapp",
          "name": "InfiniteSpecies",
          "url": "https://infinitespecies.com/",
          "applicationCategory": "EducationApplication",
          "operatingSystem": "Any (modern web browser)",
          "browserRequirements": "Requires JavaScript and HTML5 Canvas.",
          "description": "Explore the complete tree of life in one zoomable, interactive map. Navigate from high-level domains down to individual species, search organisms by scientific name, and deep-link to any view.",
          "inLanguage": ["en", "he"],
          "image": "https://infinitespecies.com/landing-tree-bg1.png",
          "isAccessibleForFree": true,
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "creator": { "@id": "https://infinitespecies.com/#organization" }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Warm up the connection to the taxonomy data API so the map loads faster. -->
    <link rel="preconnect" href="https://infinitespecies-production.up.railway.app" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <!-- Fallback content for crawlers and users without JavaScript. The interactive map below
         requires JS; this gives search engines and assistive tech real, indexable text. -->
    <noscript>
      <main style="max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem; color: #e6e9f2; background: #0d0f1a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6;">
        <h1>InfiniteSpecies — Explore the Tree of Life</h1>
        <p>
          InfiniteSpecies is an interactive, zoomable visualization of Earth's biological tree of life.
          Millions of organisms are laid out as one continuous map, so you can travel from the broadest
          domains and kingdoms all the way down to individual species.
        </p>
        <h2>What you can do</h2>
        <ul>
          <li>Zoom smoothly from domains, kingdoms, and phyla down to genera and species.</li>
          <li>Search for any organism or group by its scientific name.</li>
          <li>Open Wikipedia summaries and links to databases such as GBIF, NCBI, and iNaturalist.</li>
          <li>Copy a deep link to share the exact organism and view you are looking at.</li>
          <li>Use the app in English or Hebrew.</li>
        </ul>
        <p>
          The interactive map requires JavaScript. Please enable JavaScript in your browser and reload
          the page to start exploring at <a href="https://infinitespecies.com/" style="color: #5b8def;">infinitespecies.com</a>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
