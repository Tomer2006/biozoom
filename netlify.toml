[build]
  # Build command for Vite
  # Remove package-lock.json and node_modules to fix npm bug with optional dependencies
  # This allows npm to regenerate package-lock.json for Linux platform with correct optional deps
  # See: https://github.com/npm/cli/issues/4828
  command = "rm -rf node_modules package-lock.json && npm cache clean --force && npm install && npm run build"
  # Publish directory (Vite outputs to dist/)
  publish = "dist"
  # Functions directory (if you have serverless functions)
  functions = "netlify/functions"

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers configuration (alternative to _headers file)
# This ensures JavaScript modules are served with correct Content-Type
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

